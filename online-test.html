<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        http-equiv="refresh"
        content="0;url=student.html#test"
    >

    <meta name="theme-color" content="#1769e8">

    <title>SSC CLASSES - Online Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .box {
            width: min(90%, 420px);
            padding: 30px 20px;
            text-align: center;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .loader {
            width: 38px;
            height: 38px;
            margin: 0 auto 15px;
            border: 4px solid #e5e7eb;
            border-top-color: #1769e8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #1769e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="loader"></div>

        <h2>SSC CLASSES</h2>

        <p>Online Test खोल रहा है...</p>

        <noscript>
            <p>अगर पेज अपने-आप नहीं खुल रहा है:</p>

            <a href="student.html#test">
                Online Test खोलें
            </a>
        </noscript>
    </div>

    <script>
        (function () {
            try {
                window.location.replace("student.html#test");
            } catch (error) {
                window.location.href = "student.html#test";
            }
        })();
    </script>

</body>
</html>
