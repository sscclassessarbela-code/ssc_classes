<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#061f45">
<title>SSC CLASSES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#061f45}
.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#061f45 0%,#082b5c 55%,#0a3c7e 100%);color:#fff;text-align:center}
.wrap{width:min(100%,430px);padding:30px 24px}
.logo{width:125px;height:125px;object-fit:contain;display:block;margin:0 auto 18px}
h1{font-size:30px;letter-spacing:.2px}
.tag{font-size:13px;margin-top:7px;color:#dbe7f8}
.dream{font-size:15px;line-height:1.8;margin-top:54px}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;margin:24px auto 0;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="splash">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="SSC CLASSES logo" onerror="this.style.display='none';">
    <h1>SSC CLASSES</h1>
    <div class="tag">Learn Today • Succeed Tomorrow</div>
    <div class="dream">Your Dream<br>Our Responsibility</div>
    <div class="spinner"></div>
  </div>
</div>
<script>
(function(){
  var target = "student.html#login";

  try{
    sessionStorage.setItem("sscSplashShown","1");
  }catch(error){
    console.warn("Splash sessionStorage unavailable:", error);
  }

  setTimeout(function(){
    try{
      window.location.replace(target);
    }catch(error){
      console.error("Splash redirect failed:", error);
      window.location.href = target;
    }
  },2500);
})();
</script>
</body>
</html>
